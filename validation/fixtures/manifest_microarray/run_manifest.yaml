accession: GSE123456
route: microarray_series_matrix

input:
  file: raw/array_matrix.tsv
  input_type: microarray_intensity
  location_type: local
  gene_id_type: gene_symbol
  species: human
  platform_id: ""
  scale:
    transformed: true
    transform: log2_intensity
    evidence_source: validation_fixture

sample_mapping:
  file: resources/sample_mapping_reviewed.tsv
  biological_unit: sample
  sample_id_column: sample_id
  group_column: group

design:
  formula: "~ batch + group"
  contrast:
    factor: group
    numerator: treatment
    denominator: control

review:
  input_type_confirmed: true
  sample_mapping_confirmed: true
  design_confirmed: true
  contrast_confirmed: true

limits:
  max_memory_gb: 4
