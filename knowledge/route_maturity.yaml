schema_version: 1.0
routes:
  intake:
    maturity: beta
    executor: core/R/discover_geo.R
    notes:
      - GEO metadata, supplement inventory, publication links, reviewed download, and file audit are supported.
  bulk_raw_counts:
    maturity: beta
    executor: core/R/drivers/run_bulk_counts.R
    backend: DESeq2
    validated_scenarios:
      - simple two-group raw count fixture
  bulk_normalized:
    maturity: beta
    executor: core/R/drivers/run_bulk_normalized.R
    backend: limma
    validated_scenarios:
      - paired gastric cancer FPKM transformed to log2(FPKM+1)
  microarray_series_matrix:
    maturity: experimental
    executor: core/R/drivers/run_microarray.R
    backend: limma
    known_limitations:
      - real GPL validation still needed before beta
      - platform annotation coverage varies by GPL
  enrichment_preranked_gsea:
    maturity: alpha
    executor: core/R/enrichment/run_preranked_gsea.R
    backend: fgsea
    validated_scenarios:
      - synthetic GMT/rank-table smoke fixture
    known_limitations:
      - requires local GMT and explicit rank column
  enrichment_ora:
    maturity: alpha
    executor: core/R/enrichment/run_ora_enrichment.R
    backend: Fisher's exact test (stats::fisher.test)
    validated_scenarios:
      - synthetic GMT/query/universe smoke fixture
    known_limitations:
      - requires explicit universe definition (platform, expressed, reference, or custom)
      - gene-ID mapping contract must be satisfied before ORA
  gene_id_mapping:
    maturity: alpha
    executor: core/R/mapping/gene_id_mapping.R
    backend: base R
    validated_scenarios:
      - minimal GPL annotation smoke fixture
    known_limitations:
      - org.*.eg.db integration in progress
      - multi-species support requires per-species annotation
  scrna_author_object:
    maturity: experimental
    executor: core/R/scrna/inspect_object.R
    known_limitations:
      - read-only object intake
      - clustering, marker annotation, and condition DE are external handoffs
