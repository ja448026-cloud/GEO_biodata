rule_id: scrna_object_intake_v0.1
applies_to: [scrna_raw_counts, scrna_author_object]
principle: Single-cell matrices and objects must be inventoried for orientation, layers, metadata, and raw-count preservation before QC or annotation.
inventory:
  - object_format
  - matrix_orientation
  - sparse_or_dense_storage
  - raw_count_layer
  - normalized_layer
  - scaled_layer
  - cell_metadata_fields
  - feature_metadata_fields
  - embeddings
  - graphs
  - author_labels
  - conversion_history
guardrails:
  - Keep the original object or matrix unchanged.
  - Avoid dense conversion of large sparse matrices.
  - Do not assume AnnData and Seurat have the same matrix orientation.
  - Do not use a converted object until slot/layer inventories have been compared.
  - Preserve author labels separately from harmonized labels.
safe_outcome:
  - REVIEW_REQUIRED
  - MANIFEST_VALIDATED
