rule_id: scrna_author_object_v0.1
applies_to: [scrna_author_object]
principle: Author-provided objects are valuable inputs, but raw counts, metadata fields, labels, reductions, and processing history must be inventoried before reuse.
inventory:
  - object_format
  - raw_count_layer_or_assay
  - normalized_layer_or_assay
  - sample_or_donor_field
  - author_cell_type_labels
  - cluster_labels
  - embeddings
  - filtering_notes
guardrails:
  - Preserve author labels in their original field.
  - Write harmonized labels to a separate field.
  - Do not rerun clustering or relabel cells until object contents and biological unit fields are reviewed.
safe_outcome:
  - REVIEW_REQUIRED
  - MANIFEST_VALIDATED
