rule_id: biological_replication_v0.1
applies_to: [bulk_raw_counts, bulk_normalized, microarray_series_matrix, scrna_raw_counts, scrna_author_object]
principle: Biological inference must use the donor, patient, animal, or independently prepared sample as the unit, not cells, spots, reads, or technical sections.
required_manifest_fields:
  - sample_mapping.biological_unit
recommended_checks:
  - Count independent biological units per contrast level.
  - Treat nested sections, lanes, spots, or cells as technical or within-unit observations unless metadata proves otherwise.
fail_closed_when:
  - Fewer than two biological units are available in a contrast level for basic DE.
  - The biological unit cannot be reconstructed from public metadata or reviewed supplements.
safe_outcome:
  - BLOCKED_METADATA
  - REVIEW_REQUIRED
