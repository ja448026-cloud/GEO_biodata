rule_id: gene_id_mapping_v0.1
applies_to: [enrichment_ora, enrichment_preranked_gsea]
principle: >
  Every enrichment analysis must document how probe/feature IDs were mapped to gene symbols,
  what deduplication strategy was used, and what universe (background) was defined.
required_actions:
  - Read platform annotation (GPL) or use org.*.eg.db to map feature IDs to gene symbols.
  - Record probe-to-symbol mapping statistics: total probes, mapped probes, unique genes, coverage.
  - Choose a dedup strategy for multi-mapping probes: max_abs_logfc, min_pvalue, or documented alternative.
  - Define the universe as either: all genes on the platform, all genes passing expression filter, or all genes in the reference genome.
  - Save a mapping audit table (mapping_audit.tsv) recording all decisions.
fail_closed_when:
  - Probe-to-gene mapping coverage is below 50%.
  - Universe size is not documented.
  - Dedup strategy is not stated.
contract_outputs:
  - mapping_audit.tsv
  - universe.txt (one gene symbol per line)
  - de_genes_mapped.tsv (the query gene list used for enrichment)
