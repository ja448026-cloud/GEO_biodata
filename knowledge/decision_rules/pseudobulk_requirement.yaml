rule_id: pseudobulk_requirement_v0.1
applies_to: [scrna_raw_counts, scrna_author_object]
principle: Condition-level differential expression in scRNA-seq should aggregate by biological unit and cell state where possible; cells are not independent replicates.
required_for_formal_de:
  - donor_or_sample_id
  - condition
  - cell_type_or_cluster
  - sufficient_cells_per_unit_celltype
safe_basic_outputs_without_formal_de:
  - cell_qc_metrics
  - sample_composition
  - generic_marker_presence
  - cluster_markers_descriptive
fail_closed_when:
  - donor/sample field is missing for condition-level inference.
