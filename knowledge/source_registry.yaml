schema_version: 0.1
source_tiers:
  author_processed_matrix:
    rank: 1
    description: Author-provided processed matrix or object with matching sample metadata.
  geo_sample_metadata:
    rank: 2
    description: GEO/GSM metadata and structured sample characteristics.
  publication_supplement:
    rank: 2
    description: Open supplementary tables or methods linked from PMID/PMCID.
  filename_hint:
    rank: 4
    description: Filename patterns from supplement listings; useful for candidate generation but insufficient for final route decisions.
  raw_accession:
    rank: 5
    description: SRA/BioProject/FASTQ accessions requiring external processing before matrix-level analysis.
decision_record_required_when:
  - multiple_candidate_routes
  - filename_hint_conflicts_with_metadata
  - superseries_or_subseries
  - agent_adjudicated_review
