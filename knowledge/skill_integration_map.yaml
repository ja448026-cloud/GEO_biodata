schema_version: 0.1
purpose: >
  Map reusable method guidance from local bio/ngs skills into this repository's
  generic GEO workflow rules. This file records integration intent only; the
  external skills are not runtime dependencies and no local/private paths are required.
integrated_method_sources:
  bio_workflows_scrnaseq_pipeline:
    borrowed_patterns:
      - ordered scRNA stages: input -> per-sample QC/doublets -> integration/clustering -> annotation -> pseudobulk/downstream stats
      - cells are not biological replicates for condition DE
      - integration/batch-corrected embeddings are not inputs for DE
    implemented_as:
      - skills/geo-biodata-scrna/SKILL.md
  ngs_bulk_rnaseq:
    borrowed_patterns:
      - separate raw FASTQ/count-generation handoff from count-matrix DE
      - require organism/reference/sample sheet metadata before raw processing
    implemented_as:
      - route raw_fastq_handoff
      - knowledge/decision_rules/raw_fastq_handoff.yaml
  ngs_bulk_rnaseq_differential_expression:
    borrowed_patterns:
      - require raw matrix, sample metadata, design formula, contrasts, and biological replication before DE
      - record input mode and do not pass normalized values into raw-count models
      - keep DE outputs auditable with design and QC tables
    implemented_as:
      - schemas/run_manifest.schema.yaml
      - knowledge/decision_rules/bulk_input_scale.yaml
      - core/R/drivers/run_bulk_counts.R
  ngs_scrna_seq:
    borrowed_patterns:
      - split scRNA into FASTQ-to-count, post-count QC/annotation, and downstream stats
      - route matrix or object inputs to post-count QC rather than raw alignment
    implemented_as:
      - routes scrna_raw_counts and scrna_author_object
      - skills/geo-biodata-scrna/SKILL.md
  bio_single_cell_data_io:
    borrowed_patterns:
      - preserve raw counts and original objects
      - distinguish AnnData cell-by-gene orientation from Seurat/SCE gene-by-cell orientation
      - avoid dense materialization and lossy object conversion
      - inventory h5ad/RDS layers and metadata before analysis
    implemented_as:
      - skills/geo-biodata-scrna/SKILL.md
  bio_single_cell_preprocessing:
    borrowed_patterns:
      - choose QC thresholds from distributions, not fixed universal cutoffs
      - run QC/doublet/ambient steps per sample or capture where possible
      - do not reflexively regress mitochondrial fraction, total counts, or cell cycle
    implemented_as:
      - skills/geo-biodata-scrna/SKILL.md
  bio_single_cell_clustering:
    borrowed_patterns:
      - sweep clustering resolution and validate clusters by markers/stability
      - UMAP is visualization, not a metric analysis space
      - cluster marker p-values are descriptive after clustering
    implemented_as:
      - skills/geo-biodata-scrna/SKILL.md
  bio_single_cell_markers_annotation:
    borrowed_patterns:
      - marker detection is annotation/ranking, not condition-level inference
      - preserve uncertainty and avoid overlabeling
      - use pseudobulk raw counts for condition DE
    implemented_as:
      - skills/geo-biodata-scrna/SKILL.md
  public_visualization_guidance:
    borrowed_patterns:
      - start figures from a single scientific question and explicit data unit
      - keep source table, plotting script, output, and QA traceable
      - use external visualization sources as summarized method guidance, not runtime dependencies
    implemented_as:
      - skills/geo-biodata-figure/SKILL.md
      - skills/geo-biodata-figure/references/principles-and-qa.md
      - skills/geo-biodata-figure/references/figure-decision-matrix.md
      - skills/geo-biodata-figure/references/omics-plot-recipes.md
      - skills/geo-biodata-figure/references/manuscript-figure-planning.md
      - knowledge/visualization_source_registry.yaml
deferred_or_not_integrated:
  spatial_transcriptomics_skills:
    reason: Spatial workflows need distinct image/coordinate assumptions and should not be folded into a generic GEO GSE-first transcriptome workflow.
  heavy_integration_trajectory_communication:
    reason: These are downstream specialty analyses; default GEO workflow should stop after auditable basic QC/DE/annotation readiness unless explicitly requested.
  raw_fastq_alignment_execution:
    reason: This repository should hand off to nf-core/fetchngs or assay-specific pipelines instead of embedding heavy compute execution.
