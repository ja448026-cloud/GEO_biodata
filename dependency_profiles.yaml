schema_version: 0.2
default_profile: manifest
cache_policy:
  repo_commits_raw_data: false
  repo_commits_package_libraries: false
  recommended_cache_roots:
    - R_USER_CACHE_DIR
    - RENV_PATHS_CACHE
profiles:
  manifest:
    description: Manifest validation, schemas, and quick smoke checks.
    packages:
      cran: [yaml, digest]
      bioc: []
  intake:
    description: GEO resource discovery, publication links, reviewed downloads, file hashes, and intake handoff.
    extends: [manifest]
    packages:
      cran: [httr2, jsonlite]
      bioc: [GEOquery, Biobase]
  core:
    description: Compatibility alias for the intake profile.
    extends: [intake]
    packages:
      cran: []
      bioc: []
  bulk_limma:
    description: >
      Normalized-matrix and microarray limma QC, DE, and diagnostic plots.
      - run_bulk_normalized.R: limma, ggplot2
      - run_microarray.R: limma, ggplot2, Biobase
      - bulk_limma_common.R: limma, ggplot2
    extends: [manifest]
    packages:
      cran: [ggplot2, pheatmap]
      bioc: [limma]
  bulk_counts:
    description: >
      Bulk raw-count QC and DE with DESeq2.
      - run_bulk_counts.R: DESeq2, SummarizedExperiment, ggplot2
    extends: [manifest]
    packages:
      cran: [ggplot2]
      bioc: [DESeq2, SummarizedExperiment]
  bulk:
    description: Compatibility profile for all bulk and microarray drivers.
    extends: [bulk_limma, bulk_counts]
    packages:
      cran: []
      bioc: []
  enrichment_gsea:
    description: Preranked GSEA with fgsea and a local GMT after a valid DE/rank table.
    extends: [manifest]
    packages:
      cran: [ggplot2]
      bioc: [fgsea]
  enrichment:
    description: Compatibility profile for current and planned enrichment workflows.
    extends: [enrichment_gsea]
    packages:
      cran: [msigdbr]
      bioc: [clusterProfiler, org.Hs.eg.db, org.Mm.eg.db, ReactomePA]
  scrna_intake:
    description: >
      Single-cell object intake and read-only inventory for SeuratObject, sparse matrices,
      SingleCellExperiment, and H5AD readers when available.
      H5AD support requires at least one of: anndataR (pure R, recommended) or zellkonverter.
    extends: [manifest]
    packages:
      cran: [SeuratObject, Matrix]
      bioc: [SingleCellExperiment, anndataR]
  scrna:
    description: >
      Single-cell QC, clustering, marker diagnostics, and author-label preservation.
      Use only when reclustering or marker review is requested.
    extends: [scrna_intake]
    packages:
      cran: [Seurat, patchwork, ggplot2]
      bioc: []
  scrna_pseudobulk:
    description: scRNA sample-level pseudobulk DE after raw counts are aggregated by sample and cell type.
    extends: [scrna_intake, bulk_counts]
    packages:
      cran: []
      bioc: []
  scrna_full:
    description: Full scRNA profile with additional QC/clustering helpers.
    extends: [scrna]
    packages:
      cran: []
      bioc: [scater, scran, zellkonverter]
