name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GEO_BIODATA_CI_STRICT: "true"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install quick-smoke R packages
        run: Rscript -e 'install.packages(c("yaml","digest"), repos = "https://cloud.r-project.org")'

      - name: Quick manifest, download guard, and skill checks
        run: Rscript validation/run_smoke_checks.R --quick
