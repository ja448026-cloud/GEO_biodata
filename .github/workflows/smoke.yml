name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GEO_BIODATA_CI_STRICT: "true"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      - name: Install core profile
        run: Rscript skills/geo-biodata-workflow/scripts/bootstrap_environment.R --profile core --install

      - name: Core manifest and guard tests
        run: Rscript validation/run_smoke_checks.R

  bulk:
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps for source compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Install BiocManager
        run: Rscript -e 'install.packages(c("BiocManager","yaml"), repos = "https://cloud.r-project.org")'

      - name: Install bulk profile (mandatory)
        run: Rscript skills/geo-biodata-workflow/scripts/bootstrap_environment.R --profile bulk --install

      - name: Run bulk_raw_counts driver (mandatory)
        run: |
          mkdir -p /tmp/bulk_raw_test/raw /tmp/bulk_raw_test/resources
          cp validation/fixtures/manifest_valid/run_manifest.yaml /tmp/bulk_raw_test/
          cp validation/fixtures/manifest_valid/raw/counts.tsv /tmp/bulk_raw_test/raw/
          cp validation/fixtures/manifest_valid/resources/sample_mapping_reviewed.tsv /tmp/bulk_raw_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_bulk_counts.R /tmp/bulk_raw_test/run_manifest.yaml

      - name: Run bulk_normalized driver (mandatory)
        run: |
          mkdir -p /tmp/bulk_norm_test/raw /tmp/bulk_norm_test/resources
          cp validation/fixtures/manifest_bulk_normalized/run_manifest.yaml /tmp/bulk_norm_test/
          cp validation/fixtures/manifest_bulk_normalized/raw/counts.tsv /tmp/bulk_norm_test/raw/
          cp validation/fixtures/manifest_bulk_normalized/resources/sample_mapping_reviewed.tsv /tmp/bulk_norm_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_bulk_normalized.R /tmp/bulk_norm_test/run_manifest.yaml

      - name: Run microarray driver (mandatory)
        run: |
          mkdir -p /tmp/microarray_test/raw /tmp/microarray_test/resources
          cp validation/fixtures/manifest_microarray/run_manifest.yaml /tmp/microarray_test/
          cp validation/fixtures/manifest_microarray/raw/array_matrix.tsv /tmp/microarray_test/raw/
          cp validation/fixtures/manifest_microarray/resources/sample_mapping_reviewed.tsv /tmp/microarray_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_microarray.R /tmp/microarray_test/run_manifest.yaml

      - name: Assert bulk raw-count result
        run: Rscript validation/assert_workflow_result.R /tmp/bulk_raw_test EXECUTION_COMPLETE --expect-outputs "de_results_,qc_checks.tsv,fallback_events.tsv"

      - name: Assert bulk normalized result
        run: Rscript validation/assert_workflow_result.R /tmp/bulk_norm_test EXECUTION_COMPLETE --expect-contract VALID --expect-outputs "de_results_,design_matrix_used.tsv,contrast_matrix_used.tsv,factor_levels_before_relevel.tsv"

      - name: "Negative test: raw integer mislabeled as normalized"
        run: |
          mkdir -p /tmp/neg_raw/raw /tmp/neg_raw/resources
          cp validation/fixtures/negative/raw_mislabeled_normalized/run_manifest.yaml /tmp/neg_raw/
          cp validation/fixtures/negative/raw_mislabeled_normalized/raw/counts.tsv /tmp/neg_raw/raw/
          cp validation/fixtures/negative/raw_mislabeled_normalized/resources/sample_mapping_reviewed.tsv /tmp/neg_raw/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_bulk_normalized.R /tmp/neg_raw/run_manifest.yaml 2>&1 | grep -q "INPUT_SCALE_CONFLICT" && echo "PASS: raw-like mislabeled correctly blocked" && exit 0
          echo "FAIL: raw-like mislabeled was not blocked" && exit 1

      - name: Assert microarray ran (accept EXECUTION_FAILED for no-GPL fixture)
        run: |
          Rscript validation/assert_workflow_result.R /tmp/microarray_test EXECUTION_FAILED --expect-outputs "output_integrity.tsv"

      - name: "Negative test: missing scale contract"
        run: |
          mkdir -p /tmp/neg_scale/raw /tmp/neg_scale/resources
          cp validation/fixtures/negative/missing_scale_contract/run_manifest.yaml /tmp/neg_scale/
          cp validation/fixtures/negative/missing_scale_contract/raw/counts.tsv /tmp/neg_scale/raw/
          cp validation/fixtures/negative/missing_scale_contract/resources/sample_mapping_reviewed.tsv /tmp/neg_scale/resources/
          Rscript skills/geo-biodata-workflow/scripts/validate_manifest.R /tmp/neg_scale/run_manifest.yaml && echo "FAIL: missing scale not rejected" && exit 1
          echo "PASS: missing scale correctly rejected" && exit 0

  scrna:
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      - name: Install scRNA minimal intake profile
        run: |
          Rscript -e 'install.packages(c("SeuratObject","Matrix"), repos = "https://cloud.r-project.org")'
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager"); BiocManager::install(c("SingleCellExperiment","anndataR"), ask=FALSE, update=FALSE)'

      - name: Parse scRNA intake driver
        run: Rscript -e 'parse(file = "skills/geo-biodata-workflow/scripts/drivers/inspect_scrna_object.R")'

      - name: Generate tiny Seurat RDS fixture and run inventory
        run: |
          Rscript -e '
            library(SeuratObject)
            set.seed(42)
            counts <- Matrix::Matrix(matrix(rpois(2000, lambda = 2), nrow = 100, ncol = 20), sparse = TRUE)
            rownames(counts) <- paste0("Gene", 1:100)
            colnames(counts) <- paste0("Cell", 1:20)
            meta <- data.frame(
              cell_type = sample(c("T_cell", "B_cell", "Monocyte"), 20, replace = TRUE),
              donor = rep(c("D1", "D2"), each = 10),
              condition = rep(c("treated", "control"), 10),
              row.names = colnames(counts)
            )
            seu <- CreateSeuratObject(counts = counts, meta.data = meta)
            seu <- RenameCells(seu, new.names = colnames(counts))
            saveRDS(seu, "/tmp/tiny_seurat.rds")
            cat("Seurat RDS created:", file.info("/tmp/tiny_seurat.rds")$size, "bytes\n")
          '

          mkdir -p /tmp/scrnainv_test
          printf 'accession: GSE999999\nroute: scrna_author_object\ninput:\n  file: /tmp/tiny_seurat.rds\n  input_type: author_seurat\n  location_type: local\n  species: human\nreview:\n  mode: manual\n  input_type_confirmed: true\n  sample_mapping_confirmed: true\n  design_confirmed: true\n  contrast_confirmed: true\n' > /tmp/scrnainv_test/run_manifest.yaml

          Rscript skills/geo-biodata-workflow/scripts/drivers/inspect_scrna_object.R /tmp/scrnainv_test/run_manifest.yaml

      - name: Assert scRNA inventory result
        run: Rscript validation/assert_workflow_result.R /tmp/scrnainv_test OBJECT_INVENTORY_COMPLETE --expect-inventory OBJECT_INVENTORY_COMPLETE --expect-outputs "inventory.tsv,cell_metadata_fields.tsv,inventory_summary.md"

      - name: Verify no dangerous patterns in scRNA driver
        run: |
          if grep -q 'as\.matrix.*counts' skills/geo-biodata-workflow/scripts/drivers/inspect_scrna_object.R; then
            echo "ERROR: Dangerous as.matrix() call on counts found in scRNA driver"
            exit 1
          fi
          echo "PASS: No dangerous dense-conversion patterns"
