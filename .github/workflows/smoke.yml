name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install smoke-test dependencies
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      - name: Run smoke checks
        run: Rscript validation/run_smoke_checks.R
