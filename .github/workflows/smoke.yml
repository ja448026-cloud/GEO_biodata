name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GEO_BIODATA_CI_STRICT: "true"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      - name: Install core profile
        run: Rscript skills/geo-biodata-workflow/scripts/bootstrap_environment.R --profile core --install

      - name: Core manifest and guard tests
        run: Rscript -e '
          source("validation/run_smoke_checks.R", local = TRUE)
        '

  bulk:
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install BiocManager
        run: Rscript -e 'install.packages(c("BiocManager","yaml"), repos = "https://cloud.r-project.org")'

      - name: Install bulk profile (mandatory)
        run: Rscript skills/geo-biodata-workflow/scripts/bootstrap_environment.R --profile bulk --install

      - name: Run bulk_raw_counts driver (mandatory)
        run: |
          mkdir -p /tmp/bulk_raw_test/raw /tmp/bulk_raw_test/resources
          cp validation/fixtures/manifest_valid/run_manifest.yaml /tmp/bulk_raw_test/
          cp validation/fixtures/manifest_valid/raw/counts.tsv /tmp/bulk_raw_test/raw/
          cp validation/fixtures/manifest_valid/resources/sample_mapping_reviewed.tsv /tmp/bulk_raw_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_bulk_counts.R /tmp/bulk_raw_test/run_manifest.yaml

      - name: Run bulk_normalized driver (mandatory)
        run: |
          mkdir -p /tmp/bulk_norm_test/raw /tmp/bulk_norm_test/resources
          cp validation/fixtures/manifest_bulk_normalized/run_manifest.yaml /tmp/bulk_norm_test/
          cp validation/fixtures/manifest_bulk_normalized/raw/counts.tsv /tmp/bulk_norm_test/raw/
          cp validation/fixtures/manifest_bulk_normalized/resources/sample_mapping_reviewed.tsv /tmp/bulk_norm_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_bulk_normalized.R /tmp/bulk_norm_test/run_manifest.yaml

      - name: Run microarray driver (mandatory)
        run: |
          mkdir -p /tmp/microarray_test/raw /tmp/microarray_test/resources
          cp validation/fixtures/manifest_microarray/run_manifest.yaml /tmp/microarray_test/
          cp validation/fixtures/manifest_microarray/raw/array_matrix.tsv /tmp/microarray_test/raw/
          cp validation/fixtures/manifest_microarray/resources/sample_mapping_reviewed.tsv /tmp/microarray_test/resources/
          Rscript skills/geo-biodata-workflow/scripts/drivers/run_microarray.R /tmp/microarray_test/run_manifest.yaml

  scrna:
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      - name: Install scRNA minimal intake profile
        run: |
          Rscript -e 'install.packages(c("SeuratObject","Matrix"), repos = "https://cloud.r-project.org")'
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager"); BiocManager::install(c("SingleCellExperiment","anndataR"), ask=FALSE, update=FALSE)'

      - name: Parse scRNA intake driver
        run: Rscript -e 'parse(file = "skills/geo-biodata-workflow/scripts/drivers/inspect_scrna_object.R")'

      - name: Verify no dangerous patterns in scRNA driver
        run: |
          if grep -q 'as\.matrix.*counts' skills/geo-biodata-workflow/scripts/drivers/inspect_scrna_object.R; then
            echo "ERROR: Dangerous as.matrix() call on counts found in scRNA driver"
            exit 1
          fi
          echo "PASS: No dangerous dense-conversion patterns"
