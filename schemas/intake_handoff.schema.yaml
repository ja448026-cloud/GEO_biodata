schema_version: 1.0
required_top_level:
  - schema_version
  - accession
  - run_dir
  - intake_state
  - recommended_next_module
  - selected_input
  - scale
  - sample_mapping
  - design_readiness
  - unresolved_questions
  - warnings
  - generated_at_utc
allowed_intake_states:
  - READY_FOR_MANIFEST
  - REVIEW_REQUIRED
  - BLOCKED_METADATA
  - BLOCKED_INPUT
  - RAW_COMPUTE_REQUIRED
  - SCRNA_INTAKE_READY
selected_input_fields:
  - path
  - format
  - route
  - input_type
  - species
scale_fields:
  - status
  - transformed
  - transform
  - evidence_source
  - evidence_note
sample_mapping_fields:
  - status
  - file
  - biological_unit
  - sample_id_column
  - group_column
design_readiness_fields:
  - status
  - suggested_formula
  - suggested_contrast
